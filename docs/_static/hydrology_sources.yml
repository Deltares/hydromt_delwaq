meta:
  root: path_containing_wflow_toml_file
wflow_sbm_output_em:
  data_adapter:
    rename:
      q_ss: q_ss
      ssf_to_river: exfiltssf
    unit_mult:
      exfiltssf: 1.15741e-05
      q_ss: 1.15741e-05
  data_type: RasterDataset
  driver:
    name: raster_xarray
    options:
      chunks:
        lat: -1
        lon: -1
        time: 1
      preprocess: harmonise_dims
  metadata:
    attrs:
      exfiltsatstore:
        unit: mm
      exfiltssf:
        unit: m3/s
      exfiltustore:
        unit: mm
      infilt:
        unit: mm
      precip:
        unit: mm
      q_land:
        unit: m3/s
      q_ss:
        unit: m3/s
      runPav:
        unit: mm
      runUnp:
        unit: mm
      vwcproot:
        unit: '%'
    category: hydro
    crs: EPSG:4326
  uri: ./run_wflow_sbm/output.nc
wflow_sbm_output_wq:
  data_adapter:
    rename:
      land_to_river: land>sfw
      q_river: sfw>sfw
      ssf_to_river: soil>sfw
      vol_river: sfw
    unit_mult:
      soil>sfw: 1.15741e-05
  data_type: RasterDataset
  driver:
    name: raster_xarray
    options:
      chunks:
        lat: -1
        lon: -1
        time: 1
      preprocess: harmonise_dims
  metadata:
    attrs:
      land>sfw:
        unit: m3/s
      sfw:
        unit: m3
      sfw>sfw:
        unit: m3/s
      soil>sfw:
        unit: m3/s
    category: hydro
    crs: 4326
  uri: ./run_wflow_sbm/output.nc
wflow_sed_output:
  data_adapter:
    unit_mult:
      ErodIM1: 1000000
      ErodIM2: 1000000
      ErodIM3: 1000000
  data_type: RasterDataset
  driver:
    name: raster_xarray
    options:
      chunks:
        lat: -1
        lon: -1
        time: 1
      preprocess: harmonise_dims
  metadata:
    category: sediment
    crs: 4326
  uri: ./run_wflow_sediment/output.nc
